name: Build Windows app

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtmultimedia
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build, bundle FFmpeg and package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -QtDir "$env:QT_ROOT_DIR" -AllowSelfTestFailure

      - name: Upload the finished program
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M-Veditor-windows
          path: |
            dist/*.exe
            dist/*.zip
